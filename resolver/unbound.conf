
server:
    interface: 0.0.0.0
    port: 53

    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    access-control: 127.0.0.0/8 allow
    access-control: 172.20.0.0/24 allow

    hide-identity: yes
    hide-version: yes

    verbosity: 2

    # Allow forwarding for the private .test domain
    local-zone: "test." transparent

    # DNSSEC trust anchor: our KSK public key
    trust-anchor-file: "/opt/unbound/etc/unbound/trust-anchor.key"

forward-zone:
    name: "diag.lab.test."
    forward-addr: 172.20.0.10
    forward-first: no
